map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;

    error_page 503 @maintenance;
    location @maintenance {
        default_type text/html;
        return 503 '<!doctype html><title>Updating website</title><h1>Temporarily unavailable</h1><p>A maintainer is updating the website. Please try again shortly.</p>';
    }

    location = /revision {
        default_type text/plain;
        alias /usr/share/nginx/html/revision.txt;
    }

    location = /health {
        proxy_pass http://server:8000;
    }

    location ~ ^/api(?:/|$) {
        if (-f /maintenance/active) { return 503; }
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Script bridges and administration are never browser routes.
    location ~ ^/(raw|receive|internal|docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        if (-f /maintenance/active) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}
