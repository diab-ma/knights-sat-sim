name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Python lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest

  ui:
    name: TypeScript lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  hosting:
    name: Private hosting build and smoke checks
    runs-on: ubuntu-latest
    env:
      REVISION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/test_check_hosting.py
      - run: python3 deploy/test_release.py
      - run: docker compose -f compose.hosting.yml up --build -d --wait --wait-timeout 120
      - run: python3 deploy/check-hosting.py
      - if: failure()
        run: docker compose -f compose.hosting.yml logs
      - if: always()
        run: docker compose -f compose.hosting.yml down

  access-validator:
    name: Access JWT validator cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      # Installed connector 2026.9.3. Fixture keys never reach the live tunnel.
      - uses: actions/checkout@v4
        with:
          repository: cloudflare/cloudflared
          ref: 96d39adbc812dc7363834bda908970c1a2560a72
          path: upstream-cloudflared
          persist-credentials: false
      - run: cp deploy/cloudflared-jwt_test.go upstream-cloudflared/ingress/middleware/knightsat_test.go
      - run: go test ./ingress/middleware -run TestKnightSatJWT -v
        working-directory: upstream-cloudflared

  publish:
    name: Publish revision images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, ui, hosting, access-validator]
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test and publish the exact images
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          sha = os.environ['REVISION']
          release = {'revision': sha}
          prefix = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          tag_suffix = sha + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          run('docker', 'compose', '-f', 'compose.hosting.yml', 'build')
          run('docker', 'compose', '-f', 'compose.hosting.yml', 'up', '-d', '--no-build', '--wait', '--wait-timeout', '120')
          subprocess.run(['python3', 'deploy/check-hosting.py'], check=True)
          for service in ('server', 'web'):
              tag = f'{prefix}-{service}:{tag_suffix}'
              local = f'knightsat-{service}:{sha}'
              info = json.loads(run('docker', 'inspect', local))[0]
              assert info['Config']['Labels']['org.opencontainers.image.revision'] == sha
              run('docker', 'tag', local, tag)
              run('docker', 'push', tag)
              refs = json.loads(run('docker', 'inspect', tag))[0]['RepoDigests']
              release[service] = next(r.split('@')[1] for r in refs if r.startswith(f'{prefix}-{service}@'))
              immutable = f'{prefix}-{service}@{release[service]}'
              run('docker', 'pull', immutable)
              pulled = json.loads(run('docker', 'inspect', immutable))[0]
              assert pulled['Id'] == info['Id'], 'Registry image differs from tested image'
          Path('release.json').write_text(json.dumps(release)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_attempt }}
          path: release.json
          retention-days: 90
      - if: always()
        run: docker compose -f compose.hosting.yml down
